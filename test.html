<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Safe Signal Model Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; }
        textarea { width: 100%; height: 120px; }
        pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Safe Signal local model test</h1>
    <p>This page talks to the extension engine. It does not send text to a server.</p>
    <textarea id="text">I really liked your post.</textarea>
    <p>
        <button id="run" type="button">Run detection</button>
    </p>
    <pre id="out">Waiting...</pre>
    <script src="config.js"></script>
    <script>
        const out = document.getElementById("out");
        document.getElementById("run").addEventListener("click", () => {
            const text = document.getElementById("text").value;
            out.textContent = "Running...";
            chrome.runtime.sendMessage(
                { target: "background", type: "PREDICT", text: text },
                (response) => {
                    if (chrome.runtime.lastError) {
                        out.textContent = chrome.runtime.lastError.message;
                        return;
                    }
                    out.textContent = JSON.stringify(response, null, 2);
                }
            );
        });
    </script>
</body>
</html>
