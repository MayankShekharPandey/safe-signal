<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Safe Signal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 280px;
            margin: 0;
            padding: 16px;
            color: #222;
        }
        h2 {
            margin: 0 0 8px;
            font-size: 18px;
        }
        p {
            margin: 0 0 10px;
            font-size: 13px;
            color: #555;
        }
        label {
            display: block;
            font-size: 13px;
            margin: 12px 0 6px;
        }
        input[type="range"] {
            width: 100%;
        }
        #status {
            font-weight: bold;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h2>Safe Signal</h2>
    <p>On-device bullying detection</p>
    <p>Status: <span id="status">Checking...</span></p>

    <label for="threshold">Toxicity threshold: <span id="thresholdValue">0.90</span></label>
    <input id="threshold" type="range" min="50" max="95" step="1" value="90">

    <label for="debounce">Debounce: <span id="debounceValue">500</span> ms</label>
    <input id="debounce" type="range" min="300" max="700" step="50" value="500">

    <div class="row">
        <input id="debug" type="checkbox" checked>
        <label for="debug">Enable debug logs</label>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
